rna:
    is_cluster_genes: False
    is_hierarchical_clusters: True
    clustering_threshold: 0.7
    scaling_method: "MinMaxScaler"
    scaling_params: {}
    var_threshold: -1
    root_path: "../"
    # rna_dataset_path: "src/data/rna_balanced_dataset.csv"
    rna_dataset_path: "src/data/rna_dataset_full_tcga_go.csv"
    rna_columns_path: "src/data/final_clusters_GO_v3.json-columns"
    debug_mode: False

cnv:
    is_cluster_genes: False
    is_hierarchical_clusters: True
    clustering_threshold: 0.7
