    scaling_params: {}
    var_threshold: 0.0
    root_path: "../"
    cnv_dataset_path: "src/data/cnv_dataset_full_tcga.csv"

mri:
    sizes: [64, 64, 64]
    modalities: ["t1c"]
    tensor_name : "roi"
    root_path: "/data/BraTS_2023/MRI"

