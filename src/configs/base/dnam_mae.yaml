experiment_name: "dnam_clusters_pretraining_big_september"
n_epochs: 800
n_intervals: 20
random_seed: 1380
warmup_epochs: 50 

optimizer:
    name: "Adam"
    params:
        lr: 1e-4 # 2e-5
        weight_decay: 0.05
    
scheduler: 
    name: "CosineAnnealingLR"
    params:
        eta_min: 5e-6

type: "unimodal"
strategy: "mae" # mae, survival
modalities: ["dnam"]
architecture: "MAE"
splits: 5
root_path: "../"
save_path : "outputs/models/"
data_path: "src/data/dataset_full_tcga_all_balanced.csv"
rna_dataset_path: "src/data/rna_dataset_full_tcga.csv"


device: "cuda:2"
remove_nan_column: 'DNAm'
batch_size: 64

log:
    logging: True
    logging_platform: "neptune"
