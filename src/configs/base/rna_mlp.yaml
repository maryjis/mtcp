experiment_name: "rna_LUAD_survival_mlp_drop0.1_random_final_version"
n_epochs: 20
warmup_epochs: 5
n_intervals: 20
random_seed: 1380

optimizer:
    name: "Adam"
    params:
        lr: 1e-4 # 2e-5
        weight_decay: 1e-2

scheduler: 
    name: "CosineAnnealingLR"
    params:
        eta_min: 5e-6


type: "unimodal"
strategy: "survival" # mae, survival
modalities: ["rna"]
architecture: "MLP"
splits: 5

root_path: "../"
save_path : "outputs/models/"
data_path: "src/data/dataset_inetrsection_all_v2.csv"
rna_dataset_path: "src/data/rna_dataset_full_tcga.csv"
device: "cuda:0"
remove_nan_column: 'RNA'
batch_size: 24
project_ids: ["LUAD"]
sampler: True
loss:
    additional_loss: "CoxPHLoss"
    alpha: 0.7

log:
    logging: True
    logging_platform: "neptune"
