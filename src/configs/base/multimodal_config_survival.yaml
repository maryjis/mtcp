experiment_name: "multimodal_rna_dnam_wsi_multimodal_unfreeze10_warmup_clip_survival"
n_epochs: 10
warmup_epochs: 5
n_intervals: 20
random_seed: 1380

optimizer:
    name: "AdamW"
    params:
        lr: 1e-4
        weight_decay: 1e-2
    
scheduler: 
    name: "CosineAnnealingLR"
    params:
        eta_min: 5e-6

type: "multimodal"
strategy: "survival" # mae, survival

modalities: ["rna", "dnam", "wsi"]

multimodal_intersection_test: true
architecture: "MAE"
splits: 5
save_path : "outputs/models/"
project_ids: ["GBM", "LGG"]

data_path: "src/data/dataset_inetrsection_all_v2.csv"
rna_dataset_path: "src/data/rna_dataset_full_tcga.csv"
device: "cuda:2"
#available_gpus:  [0]  # Указываем, какие GPU можно использовать
remove_nan_column: 'RNA'
batch_size: 24

log:
    logging: True
    logging_platform: "neptune"
    project_name: "almachan2358/cancer-mtcp"
