experiment_name: "unimodal_wsi_800_mae_macha_bigvit_pretrained"
n_epochs: 800
n_intervals: 20
random_seed: 1380

optimizer:
    name: "AdamW"
    params:
        lr: 1.5e-5
        weight_decay: 1e-2
    
scheduler: 
    name: "CosineAnnealingLR"
    params:
        eta_min: 5e-10


type: "unimodal"
strategy: "mae" # mae, survival
modalities: ["wsi"] #rna, mri
architecture: "MAE"
data_path: "src/data/dataset_full_tcga_all_balanced.csv"
root_path: "../"
save_path : "outputs/models/"
device: "cuda:0"
remove_nan_column: 'WSI_initial'
batch_size: 256


log:
    logging: True
    logging_platform: "neptune"
