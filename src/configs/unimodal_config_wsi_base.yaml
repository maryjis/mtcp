defaults: 
    - model: wsi_base
    - base: unimodal_wsi
    - data: wsi_mae
base:
    experiment_name: "wsi base from article"
    n_epochs: 50
    n_intervals: 20
    random_seed: 1380

    optimizer:
        name: "AdamW"
        params:
            lr: 1e-3
            weight_decay: 1e-2
    
    scheduler: 
        name: "CosineAnnealingLR"
        params:
            eta_min: 5e-6


    type: "unimodal"
    strategy: "survival" # mae, survival
    modalities: ["wsi"] #rna, mri
    splits: 5
    project_ids: ["LGG", "GBM"]
    data_path: "src/data/dataset_full_tcga_all_balanced.csv"
    root_path: "../"
    save_path : "outputs/models/"
    device: "cuda:2"
    remove_nan_column: 'WSI_initial'
    batch_size: 24

    log:
        logging: True
        logging_platform: "neptune"
        project_name: "almachan2358/cancer-mtcp"
        run_name: "survival1"
