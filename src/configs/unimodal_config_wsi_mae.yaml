defaults: 
    - model: wsi_mae_model
    - base: wsi_mae_model
    - data: wsi_mae
base:

    experiment_name: "unimodal_wsi_1600_mae_macha_smal_lr_bigvit_pretrained"
    n_epochs: 1600
    warmup_epochs: 10 
    n_intervals: 20
    random_seed: 1380

    optimizer:
        name: "AdamW"
        params:
            lr: 1e-4
            weight_decay: 0.05
            # betas: [0.9, 0.99]
            # eps: 1e-08
    
    scheduler: 
        name: "CosineAnnealingLR"
        params:
            eta_min: 5e-10


    type: "unimodal"
    strategy: "mae" # mae, survival
    modalities: ["wsi"] #rna, mri
    splits: 5
    data_path: "src/data/dataset_full_tcga_all_balanced.csv"
    root_path: "../"
    save_path : "outputs/models/wsi-pretrained_macha"

    device: "cuda:1"  # Указываем, что основное устройство - GPU 2
    available_gpus:  [1]  # Указываем, какие GPU можно использовать
    remove_nan_column: 'WSI_initial'
    batch_size: 64
    
    log:
        logging: True
        logging_platform: "neptune"
        project_name: "almachan2358/cancer-mtcp"
        run_name: "mae_wsi_macha_100"
