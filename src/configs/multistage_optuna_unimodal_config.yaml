defaults: 
  - base@stages.pretrain.base: mri_time_diffusion_pretrain
  - model@stages.pretrain.model: mri_time_diffusion_pretrain
  - data@stages.pretrain.data: mri_mae
  - base@stages.task.base: mri_time_diffusion_model
  - model@stages.task.model: mri_time_diffusion_model
  - data@stages.task.data: mri_mae
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: grid
  - _self_

debug: True

hydra:
  mode: MULTIRUN
  sweeper:
    direction: maximize #!!! CHECK BEFORE LAUNCH !!!
    study_name: mri_diffusion_t1c_sample_prediction
    storage: null
    n_trials: 1
    n_jobs: 1
    params:
      stages.pretrain.base.n_epochs: choice(50)
      stages.task.base.n_epochs: choice(50)

stages:
  pretrain:
    metric: "mse_loss.mean"
    base:
      experiment_name: "mri_diffusion_pretrain_t1c_sample_prediction_50"
      n_epochs: 50
      splits: 5
    
  task:
    metric: "cs_score.mean"
    base:
      experiment_name: "mri_diffusion_model_t1c_sample_prediction_50"
      n_epochs: 50
      splits: 5
    model:
      pretrained_model_name: "mri_diffusion_pretrain_t1c_sample_prediction_50"
      is_load_pretrained: true